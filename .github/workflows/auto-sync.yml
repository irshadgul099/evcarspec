name: Auto-Sync /ev/ Pages to Static index.html & sitemap.xml

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ev/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-ev-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync /ev/*.html into Static index.html, Top Charts & sitemap.xml
        run: node scripts/sync-ev.js

      - name: Commit & Push Updated Static index.html + sitemap.xml
        run: |
          git config user.name "evcarspec-auto-bot"
          git config user.email "bot@evcarspec.com"
          git add index.html sitemap.xml robots.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto-sync): sync /ev/ vehicles to index.html & sitemap.xml"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
