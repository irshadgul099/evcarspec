<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EV Specifications, Range & Global Prices | EVCarSpec.com</title>
  <meta name="description" content="Complete electric vehicle technical specifications, usable battery capacity, real-world range, DC fast charging speed, and multi-country prices." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/evs-data.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <!-- Top Header with Quick Categories & Top Brands Bar -->
  <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-lg border-b border-slate-800">
    <!-- Row 1: Logo + Quick Category Links + Action Buttons -->
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <a href="/" class="text-2xl font-extrabold tracking-tight text-emerald-400">EVCarSpec<span class="text-white">.com</span></a>
        <span class="hidden md:inline-block bg-emerald-500/20 text-emerald-300 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-emerald-500/30">Global EV Database</span>
      </div>

      <!-- Quick Category & Powertrain Links in Top Bar -->
      <nav class="hidden lg:flex items-center space-x-4 text-xs font-bold text-slate-300">
        <button onclick="openFilterView('category', 'SUV')" class="hover:text-emerald-400 transition">🚙 SUVs</button>
        <button onclick="openFilterView('category', 'Sedan')" class="hover:text-emerald-400 transition">🚗 Sedans</button>
        <button onclick="openFilterView('category', 'Truck')" class="hover:text-emerald-400 transition">🛻 Trucks</button>
        <button onclick="openFilterView('category', 'Scooter')" class="hover:text-emerald-400 transition">🛵 Scooters</button>
        <button onclick="openFilterView('category', 'Bicycle')" class="hover:text-emerald-400 transition">🚲 Bicycles</button>
        <button onclick="openFilterView('category', 'Bus')" class="hover:text-emerald-400 transition">🚌 EV Buses</button>
        <button onclick="openFilterView('powertrain', 'PHEV')" class="text-blue-300 hover:text-blue-200 transition">🔌 PHEV</button>
        <button onclick="openFilterView('powertrain', 'HEV')" class="text-amber-300 hover:text-amber-200 transition">♻️ HEV</button>
      </nav>

      <div class="flex items-center gap-2">
        <a href="#inPageCompare" id="topCompareBtn" class="hidden sm:inline-block text-xs bg-emerald-600 hover:bg-emerald-500 px-3 py-2 rounded-lg font-bold transition">⚖️ Compare EV</a>
        <a href="/" class="text-xs sm:text-sm bg-slate-800 hover:bg-slate-700 px-3.5 py-2 rounded-lg font-bold transition border border-slate-700">← Home</a>
      </div>
    </div>

    <!-- Row 2: Clickable Top Brands Strip (Visible on every spec page!) -->
    <div class="bg-slate-950/90 border-t border-slate-800/80 py-2 px-4">
      <div class="max-w-7xl mx-auto flex items-center gap-1.5 overflow-x-auto no-scrollbar text-xs">
        <span class="text-slate-400 font-bold uppercase text-[11px] shrink-0 mr-1">Top Brands:</span>
        <div id="topBrandsBar" class="flex items-center gap-1.5 shrink-0"></div>
      </div>
    </div>
  </header>

  <!-- Dynamic Filter Drawer / Collection View (Opens when user clicks any Brand, Category, Architecture, Chemistry or Drive) -->
  <section id="filterCollectionSection" class="hidden max-w-6xl mx-auto px-4 pt-6">
    <div class="bg-emerald-950 text-white p-6 rounded-2xl shadow-lg border border-emerald-700/50 mb-6">
      <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
        <div>
          <span id="filterBadgeLabel" class="bg-emerald-500/20 text-emerald-300 text-xs font-extrabold px-3 py-1 rounded-full uppercase">Filtered View</span>
          <h2 id="filterCollectionTitle" class="text-2xl font-extrabold mt-2">Matching Electric Vehicles</h2>
        </div>
        <div class="flex gap-2">
          <button id="backToCarBtn" onclick="closeFilterView()" class="bg-white text-slate-900 hover:bg-emerald-400 font-extrabold text-xs px-4 py-2.5 rounded-xl transition">
            ← Back to Current Spec Page
          </button>
          <a href="/" class="bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition">
            All EVs on Home
          </a>
        </div>
      </div>
      <div id="filterCollectionGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 text-slate-800"></div>
    </div>
  </section>

  <!-- Main Dynamic Container -->
  <main id="mainContent" class="max-w-6xl mx-auto px-4 py-8">
    <div class="bg-white p-10 rounded-2xl shadow-sm border border-slate-200 text-center my-8">
      <h1 class="text-xl font-bold text-slate-800">Loading EV Specifications...</h1>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 py-8 px-4 text-center text-sm mt-12 border-t border-slate-800">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <p>© 2026 EVCarSpec.com — Independent Electric Vehicle Specifications Database.</p>
      <div class="space-x-4 text-xs">
        <a href="/about/" class="hover:text-white">About</a>
        <a href="/contact/" class="hover:text-white">Contact</a>
        <a href="/privacy-policy/" class="hover:text-white">Privacy Policy</a>
        <a href="/terms/" class="hover:text-white">Terms</a>
      </div>
    </div>
  </footer>

  <script>
    let currentCar = null;
    let currentBatteryKwh = 75;

    function getPowertrain(car) {
      return (car.powertrain || "BEV").toUpperCase();
    }

    function renderTopBrandsBar() {
      const db = window.EV_DATABASE || [];
      const brands = [...new Set(db.map(c => c.brand))];
      const bar = document.getElementById("topBrandsBar");
      if (!bar) return;

      bar.innerHTML = brands.map(b => `
        <button onclick="openFilterView('brand', '${b}')" class="px-2.5 py-1 rounded-lg font-bold transition whitespace-nowrap ${currentCar && currentCar.brand === b ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 hover:bg-emerald-600 text-slate-200 hover:text-white'}">
          ${b}
        </button>
      `).join('');
    }

    // Opens a live clickable collection whenever the user clicks Brand, Category, Powertrain, Architecture, Chemistry, or Drivetrain
    function openFilterView(filterType, filterValue) {
      const db = window.EV_DATABASE || [];
      let matches = [];
      let title = "";

      if (filterType === "brand") {
        matches = db.filter(c => c.brand.toLowerCase() === filterValue.toLowerCase());
        title = `All ${filterValue} Vehicles (${matches.length} Models)`;
      } else if (filterType === "category") {
        matches = db.filter(c => c.category.toLowerCase() === filterValue.toLowerCase());
        title = `All Electric ${filterValue}s (${matches.length} Models)`;
      } else if (filterType === "powertrain") {
        matches = db.filter(c => getPowertrain(c) === filterValue.toUpperCase());
        title = `All ${filterValue.toUpperCase()} Vehicles (${matches.length} Models)`;
      } else if (filterType === "architecture") {
        matches = db.filter(c => (c.architecture || "").toLowerCase().includes(filterValue.toLowerCase()));
        title = `Vehicles with ${filterValue} Architecture (${matches.length} Models)`;
      } else if (filterType === "chemistry") {
        matches = db.filter(c => (c.chemistry || "").toLowerCase().includes(filterValue.toLowerCase()));
        title = `Vehicles with ${filterValue} Battery Chemistry (${matches.length} Models)`;
      } else if (filterType === "drive") {
        matches = db.filter(c => (c.drive || "").toLowerCase().includes(filterValue.toLowerCase()));
        title = `Vehicles with ${filterValue} Drivetrain (${matches.length} Models)`;
      }

      const section = document.getElementById("filterCollectionSection");
      const grid = document.getElementById("filterCollectionGrid");
      document.getElementById("filterBadgeLabel").innerText = `${filterType.toUpperCase()}: ${filterValue}`;
      document.getElementById("filterCollectionTitle").innerText = title;

      const backBtn = document.getElementById("backToCarBtn");
      if (currentCar) {
        backBtn.classList.remove("hidden");
        backBtn.innerText = `← Back to ${currentCar.name}`;
      } else {
        backBtn.classList.add("hidden");
      }

      grid.innerHTML = matches.map(item => `
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-center mb-1">
              <button onclick="openFilterView('brand', '${item.brand}')" class="text-xs font-extrabold text-emerald-600 uppercase hover:underline">${item.brand} ↗</button>
              <div class="flex gap-1">
                <button onclick="openFilterView('category', '${item.category}')" class="bg-slate-100 hover:bg-emerald-100 text-slate-700 text-[11px] font-bold px-2 py-0.5 rounded">${item.category}</button>
                <button onclick="openFilterView('powertrain', '${getPowertrain(item)}')" class="bg-emerald-100 text-emerald-800 text-[11px] font-extrabold px-2 py-0.5 rounded">${getPowertrain(item)}</button>
              </div>
            </div>
            <a href="/${item.slug}/" class="text-base font-extrabold text-slate-900 hover:text-emerald-600 block">${item.name}</a>
            <p class="text-xs text-slate-500 mt-1">${item.battery} • <strong class="text-emerald-600">${item.rangeText}</strong></p>
            <p class="text-xs font-bold text-slate-800 mt-1">US: ${item.prices.us} | IN: ${item.prices.in}</p>
          </div>
          <a href="/${item.slug}/" class="mt-3 block text-center bg-slate-900 hover:bg-emerald-600 text-white text-xs font-bold py-2 rounded-lg transition">
            Open Full Specs →
          </a>
        </div>
      `).join('');

      section.classList.remove("hidden");
      section.scrollIntoView({ behavior: "smooth" });
    }

    function closeFilterView() {
      document.getElementById("filterCollectionSection").classList.add("hidden");
    }

    function initSmartRouter() {
      const rawPath = window.location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
      const db = window.EV_DATABASE || [];

      if (rawPath === "404" || rawPath === "404.html") {
        window.history.replaceState(null, "", "/");
      }

      const car = db.find(c => c.slug.toLowerCase() === rawPath);
      currentCar = car || null;
      renderTopBrandsBar();

      const container = document.getElementById("mainContent");

      // Check if URL is a direct Brand or Category slug (e.g., /ather/ or /tesla/ or /scooter/ or /bus/)
      if (!car && rawPath) {
        const brandMatch = db.find(c => c.brand.toLowerCase() === rawPath);
        const catMatch = db.find(c => c.category.toLowerCase() === rawPath);
        const ptMatch = db.find(c => getPowertrain(c).toLowerCase() === rawPath);
        if (brandMatch) {
          openFilterView('brand', brandMatch.brand);
        } else if (catMatch) {
          openFilterView('category', catMatch.category);
        } else if (ptMatch) {
          openFilterView('powertrain', getPowertrain(ptMatch));
        }
      }

      // If no specific vehicle matched, show full searchable directory
      if (!car) {
        document.title = "EVCarSpec — Browse All Electric Vehicles, Bikes & Buses";
        container.innerHTML = `
          <div class="bg-slate-900 text-white p-6 md:p-10 rounded-3xl shadow-lg mb-8 text-center">
            <h1 class="text-2xl md:text-4xl font-extrabold mb-3">Browse All <span class="text-emerald-400">Electric Vehicles, Bikes & Buses</span></h1>
            <p class="text-slate-300 text-sm md:text-base max-w-2xl mx-auto mb-6">Click any brand in the top bar or search below to explore full specifications.</p>
            <div class="max-w-xl mx-auto">
              <input id="dirSearch" oninput="filterDirectory()" type="text" placeholder="🔍 Search any EV (e.g. Tesla, BYD, Ather, Bus, Bicycle, PHEV)..." class="w-full px-4 py-3 rounded-xl text-slate-900 font-medium text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400" />
            </div>
          </div>
          <div id="dirGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        `;
        filterDirectory();
        return;
      }

      // Render Full Car Specification Page with 100% CLICKABLE Breadcrumbs, Badges & Spec Tags
      currentBatteryKwh = car.usableKwh || 60;
      const pt = getPowertrain(car);
      document.title = `${car.name} (${pt}) Specifications, Battery, Range & Price | EVCarSpec`;

      const rivals = [
        ...db.filter(c => c.slug !== car.slug && c.category === car.category),
        ...db.filter(c => c.slug !== car.slug && c.category !== car.category)
      ].slice(0, 6);

      const allOtherCars = db.filter(c => c.slug !== car.slug);

      container.innerHTML = `
        <!-- 100% CLICKABLE BREADCRUMBS (Home » Brand » Category » Model) -->
        <nav class="flex flex-wrap items-center gap-1.5 text-xs text-slate-500 mb-4 bg-white px-4 py-2.5 rounded-xl border border-slate-200 shadow-sm">
          <a href="/" class="font-bold text-slate-700 hover:text-emerald-600 hover:underline">🏠 Home</a>
          <span>&raquo;</span>
          <button onclick="openFilterView('brand', '${car.brand}')" class="font-bold text-emerald-700 hover:text-emerald-500 hover:underline cursor-pointer" title="View all ${car.brand} models">
            ${car.brand} ↗
          </button>
          <span>&raquo;</span>
          <button onclick="openFilterView('category', '${car.category}')" class="font-bold text-slate-700 hover:text-emerald-600 hover:underline cursor-pointer" title="View all ${car.category}s">
            ${car.category}s ↗
          </button>
          <span>&raquo;</span>
          <span class="text-slate-900 font-extrabold">${car.name}</span>
        </nav>

        <!-- Hero Overview with CLICKABLE BADGES -->
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 mb-8">
          <div class="flex flex-wrap items-center gap-2 mb-3">
            <button onclick="openFilterView('brand', '${car.brand}')" class="bg-emerald-100 hover:bg-emerald-600 hover:text-white text-emerald-800 text-xs font-extrabold px-3 py-1.5 rounded-full uppercase transition cursor-pointer" title="Click to see all ${car.brand} models">
              🏷️ ${car.brand} ↗
            </button>
            <button onclick="openFilterView('category', '${car.category}')" class="bg-slate-100 hover:bg-slate-900 hover:text-white text-slate-700 text-xs font-extrabold px-3 py-1.5 rounded-full uppercase transition cursor-pointer" title="Click to see all ${car.category}s">
              🚘 ${car.category} ↗
            </button>
            <button onclick="openFilterView('powertrain', '${pt}')" class="bg-purple-100 hover:bg-purple-700 hover:text-white text-purple-800 text-xs font-extrabold px-3 py-1.5 rounded-full uppercase transition cursor-pointer" title="Click to see all ${pt} vehicles">
              ⚡ ${pt} ↗
            </button>
            <button onclick="openFilterView('architecture', '${car.architecture}')" class="bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-700 text-xs font-extrabold px-3 py-1.5 rounded-full transition cursor-pointer" title="Click to see all ${car.architecture} vehicles">
              🔌 ${car.architecture} Architecture ↗
            </button>
            <button onclick="openFilterView('chemistry', '${car.chemistry.split('/')[0].trim()}')" class="bg-amber-50 hover:bg-amber-600 hover:text-white text-amber-800 text-xs font-extrabold px-3 py-1.5 rounded-full transition cursor-pointer" title="Click to see all ${car.chemistry} vehicles">
              🧪 ${car.chemistry} ↗
            </button>
          </div>

          <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-4">${car.name} — Full Specifications, Range & Global Price</h1>
          <p class="text-slate-600 leading-relaxed mb-6">${car.verdict}</p>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100 text-center">
            <div><span class="block text-xs text-slate-500">Battery Capacity</span><strong class="text-lg text-slate-900">${car.battery}</strong></div>
            <div><span class="block text-xs text-slate-500">Official Range</span><strong class="text-lg text-emerald-600">${car.rangeText}</strong></div>
            <div><span class="block text-xs text-slate-500">Fast Charging</span><strong class="text-lg text-slate-900">${car.dcChargeKw}</strong></div>
            <div><span class="block text-xs text-slate-500">Acceleration</span><strong class="text-lg text-slate-900">${car.accel}</strong></div>
          </div>

          <!-- Pros & Cons -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
            <div class="bg-emerald-50/60 border border-emerald-200 p-4 rounded-xl">
              <h3 class="text-sm font-bold text-emerald-900 mb-2">✅ Key Strengths (Pros)</h3>
              <ul class="text-xs text-emerald-800 space-y-1.5 list-disc pl-4">
                ${(car.pros || []).map(p => `<li>${p}</li>`).join('')}
              </ul>
            </div>
            <div class="bg-rose-50/60 border border-rose-200 p-4 rounded-xl">
              <h3 class="text-sm font-bold text-rose-900 mb-2">⚠️ Limitations (Cons)</h3>
              <ul class="text-xs text-rose-800 space-y-1.5 list-disc pl-4">
                ${(car.cons || []).map(c => `<li>${c}</li>`).join('')}
              </ul>
            </div>
          </div>
        </div>

        <!-- Global Prices -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
          <h2 class="text-xl font-bold text-slate-900 mb-4">🌍 ${car.name} Country-Wise Price Guide</h2>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 text-center text-sm">
            <div class="p-3 bg-slate-50 rounded-xl border"><span class="block text-xs text-slate-500">🇺🇸 USA</span><strong class="text-slate-900">${car.prices.us}</strong></div>
            <div class="p-3 bg-slate-50 rounded-xl border"><span class="block text-xs text-slate-500">🇬🇧 UK</span><strong class="text-slate-900">${car.prices.uk}</strong></div>
            <div class="p-3 bg-slate-50 rounded-xl border"><span class="block text-xs text-slate-500">🇪🇺 Europe</span><strong class="text-slate-900">${car.prices.eu}</strong></div>
            <div class="p-3 bg-slate-50 rounded-xl border"><span class="block text-xs text-slate-500">🇨🇳 China</span><strong class="text-slate-900">${car.prices.cn}</strong></div>
            <div class="p-3 bg-slate-50 rounded-xl border"><span class="block text-xs text-slate-500">🇦🇪 UAE</span><strong class="text-slate-900">${car.prices.ae}</strong></div>
            <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-200"><span class="block text-xs text-emerald-700">🇮🇳 India</span><strong class="text-emerald-900">${car.prices.in}</strong></div>
          </div>
        </div>

        <!-- 4 Spec Cards with Clickable Spec Values -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-900 mb-4 border-b pb-2">🔋 Battery & Real-World Range</h2>
            <div class="space-y-3 text-sm">
              <div class="flex justify-between"><span class="text-slate-500">Powertrain Type:</span><button onclick="openFilterView('powertrain', '${pt}')" class="font-bold text-emerald-600 hover:underline">${pt} ↗</button></div>
              <div class="flex justify-between"><span class="text-slate-500">Battery Capacity:</span><span class="font-semibold">${car.battery} (${car.usableKwh} kWh Usable)</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Cell Chemistry:</span><button onclick="openFilterView('chemistry', '${car.chemistry.split('/')[0].trim()}')" class="font-bold text-emerald-600 hover:underline">${car.chemistry} ↗</button></div>
              <div class="flex justify-between"><span class="text-slate-500">Certified Range:</span><span class="font-semibold text-emerald-600">${car.rangeText}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Real-World Range:</span><span class="font-semibold">${car.realRange}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Energy Efficiency:</span><span class="font-semibold">${car.efficiency}</span></div>
            </div>
          </div>

          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-900 mb-4 border-b pb-2">⚡ Charging Speed & Time</h2>
            <div class="space-y-3 text-sm">
              <div class="flex justify-between"><span class="text-slate-500">Voltage Architecture:</span><button onclick="openFilterView('architecture', '${car.architecture}')" class="font-bold text-emerald-600 hover:underline">${car.architecture} ↗</button></div>
              <div class="flex justify-between"><span class="text-slate-500">Peak DC Fast Charge:</span><span class="font-semibold">${car.dcChargeKw}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Fast Charge Time:</span><span class="font-semibold">${car.dcChargeTime}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">AC / Home Charger:</span><span class="font-semibold">${car.acChargeKw}</span></div>
            </div>
          </div>

          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-900 mb-4 border-b pb-2">🚀 Motor Power & Acceleration</h2>
            <div class="space-y-3 text-sm">
              <div class="flex justify-between"><span class="text-slate-500">Manufacturer:</span><button onclick="openFilterView('brand', '${car.brand}')" class="font-bold text-emerald-600 hover:underline">${car.brand} ↗</button></div>
              <div class="flex justify-between"><span class="text-slate-500">Drivetrain:</span><button onclick="openFilterView('drive', '${car.drive.split('/')[0].trim()}')" class="font-bold text-emerald-600 hover:underline">${car.drive} ↗</button></div>
              <div class="flex justify-between"><span class="text-slate-500">Horsepower:</span><span class="font-semibold">${car.power}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Peak Torque:</span><span class="font-semibold">${car.torque}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Acceleration:</span><span class="font-semibold">${car.accel}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Top Speed:</span><span class="font-semibold">${car.topSpeed}</span></div>
            </div>
          </div>

          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-900 mb-4 border-b pb-2">📏 Dimensions, Boot & Weight</h2>
            <div class="space-y-3 text-sm">
              <div class="flex justify-between"><span class="text-slate-500">Body Category:</span><button onclick="openFilterView('category', '${car.category}')" class="font-bold text-emerald-600 hover:underline">${car.category} ↗</button></div>
              <div class="flex justify-between"><span class="text-slate-500">Dimensions (L×W×H):</span><span class="font-semibold">${car.dimensions}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Wheelbase:</span><span class="font-semibold">${car.wheelbase}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Cargo / Seating:</span><span class="font-semibold text-right">${car.bootSpace}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Curb Weight:</span><span class="font-semibold">${car.weight}</span></div>
            </div>
          </div>
        </div>

        <!-- Interactive Charging Calculator -->
        <div class="bg-slate-900 text-white p-6 md:p-8 rounded-2xl shadow-md mb-8">
          <h2 class="text-xl font-bold text-emerald-400 mb-2">🧮 Interactive ${car.name} Charging Calculator</h2>
          <p class="text-slate-300 text-sm mb-6">Estimate charging time and electricity cost based on the ${car.usableKwh} kWh usable battery pack.</p>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 text-slate-900">
            <div>
              <label class="block text-xs text-slate-300 mb-1">Charger Power (kW)</label>
              <select id="chargerPower" onchange="calcCharge()" class="w-full p-3 rounded-lg font-semibold">
                <option value="0.75">0.75 kW (Scooter/Bike Home Charger)</option>
                <option value="3.3">3.3 kW (Standard Car Home Socket)</option>
                <option value="7.4">7.4 kW (1-Phase Home Wallbox)</option>
                <option value="11" selected>11 kW (3-Phase AC Wallbox)</option>
                <option value="60">60 kW (Public DC Charger)</option>
                <option value="150">150 kW (High-Power DC Fast Charger)</option>
                <option value="300">300 kW (Ultra-Fast / Bus Depot Charger)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-slate-300 mb-1">Charge Needed (%)</label>
              <input id="chargePercent" type="number" value="70" min="10" max="100" oninput="calcCharge()" class="w-full p-3 rounded-lg font-semibold" />
            </div>
            <div>
              <label class="block text-xs text-slate-300 mb-1">Electricity Rate ($ per kWh)</label>
              <input id="elecRate" type="number" value="0.16" step="0.01" oninput="calcCharge()" class="w-full p-3 rounded-lg font-semibold" />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4 bg-slate-800 p-4 rounded-xl text-center">
            <div><span class="text-xs text-slate-400 block">Estimated Time</span><strong id="timeResult" class="text-2xl text-emerald-400">--</strong></div>
            <div><span class="text-xs text-slate-400 block">Estimated Cost</span><strong id="costResult" class="text-2xl text-emerald-400">--</strong></div>
          </div>
        </div>

        <!-- IN-PAGE SIDE-BY-SIDE COMPARISON TOOL -->
        <div id="inPageCompare" class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 mb-8">
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
            <div>
              <span class="text-xs font-bold uppercase text-emerald-600">Instant Head-to-Head</span>
              <h2 class="text-xl font-extrabold text-slate-900">⚖️ Compare ${car.name} Side-by-Side</h2>
              <p class="text-xs text-slate-500">Pick any rival from the dropdown (or click "Compare Instant" below) to compare specs right on this page.</p>
            </div>
            <div class="w-full md:w-72">
              <label class="block text-xs font-bold text-slate-500 mb-1">Compare Against:</label>
              <select id="rivalSelect" onchange="updateRivalCompare()" class="w-full bg-slate-900 text-white p-3 rounded-xl font-semibold text-sm">
                ${allOtherCars.map(r => `<option value="${r.slug}" ${r.slug === rivals[0]?.slug ? 'selected' : ''}>${r.name} (${r.brand})</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="bg-slate-900 text-white">
                  <th class="p-3.5 text-slate-300 font-medium w-1/3">Specification</th>
                  <th class="p-3.5 text-emerald-400 font-bold w-1/3">${car.name}</th>
                  <th id="rivalHeadName" class="p-3.5 text-amber-300 font-bold w-1/3">Rival EV</th>
                </tr>
              </thead>
              <tbody id="rivalCompareBody" class="divide-y divide-slate-200"></tbody>
            </table>
          </div>
        </div>

        <!-- Popular Rivals Cards with Clickable Brand & Category -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold text-slate-900 mb-4">Popular Rivals & Alternatives</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            ${rivals.map(r => `
              <div class="p-4 rounded-xl border border-slate-200 hover:border-emerald-500 transition flex flex-col justify-between bg-slate-50/50">
                <div>
                  <div class="flex justify-between items-center">
                    <button onclick="openFilterView('brand', '${r.brand}')" class="text-xs font-extrabold text-emerald-600 uppercase hover:underline">${r.brand} ↗</button>
                    <button onclick="openFilterView('category', '${r.category}')" class="text-[11px] bg-slate-200 hover:bg-emerald-600 hover:text-white px-2 py-0.5 rounded font-bold transition">${r.category}</button>
                  </div>
                  <a href="/${r.slug}/" class="block text-base font-extrabold text-slate-900 hover:text-emerald-600 mt-1">${r.name}</a>
                  <span class="text-xs text-slate-500 block mt-1">${r.battery} • ${r.rangeText}</span>
                  <span class="text-xs font-bold text-slate-800 block mt-1">US: ${r.prices.us} | IN: ${r.prices.in}</span>
                </div>
                <div class="flex gap-2 mt-4 pt-2 border-t border-slate-200/80">
                  <button onclick="quickSelectRival('${r.slug}')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-2 rounded-lg transition">
                    ⚖️ Compare Instant
                  </button>
                  <a href="/${r.slug}/" class="flex-1 text-center bg-slate-900 hover:bg-slate-700 text-white text-xs font-bold py-2 px-2 rounded-lg transition">
                    Full Specs →
                  </a>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      calcCharge();
      updateRivalCompare();
    }

    function filterDirectory() {
      const db = window.EV_DATABASE || [];
      const q = (document.getElementById("dirSearch")?.value || "").toLowerCase();
      const grid = document.getElementById("dirGrid");
      if (!grid) return;

      const list = db.filter(c => c.name.toLowerCase().includes(q) || c.brand.toLowerCase().includes(q) || c.category.toLowerCase().includes(q) || getPowertrain(c).toLowerCase().includes(q));
      grid.innerHTML = list.map(car => `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition flex flex-col justify-between">
          <div>
            <div onclick="window.location.href='/${car.slug}/'" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-4 flex justify-between items-start cursor-pointer">
              <div>
                <button onclick="event.stopPropagation(); openFilterView('brand', '${car.brand}')" class="text-xs uppercase tracking-wider text-emerald-400 hover:underline font-bold">${car.brand} ↗</button>
                <h3 class="text-lg font-extrabold leading-snug">${car.name}</h3>
              </div>
              <button onclick="event.stopPropagation(); openFilterView('category', '${car.category}')" class="bg-emerald-500/20 hover:bg-emerald-500 hover:text-slate-950 text-emerald-300 text-xs font-bold px-2.5 py-1 rounded-full">${car.category}</button>
            </div>
            <div class="p-5 space-y-2 text-sm">
              <div class="flex justify-between border-b border-slate-100 pb-1.5"><span class="text-slate-500">Battery:</span><span class="font-semibold">${car.battery}</span></div>
              <div class="flex justify-between border-b border-slate-100 pb-1.5"><span class="text-slate-500">Range:</span><span class="font-bold text-emerald-600">${car.rangeText}</span></div>
              <div class="flex justify-between border-b border-slate-100 pb-1.5"><span class="text-slate-500">Fast Charge:</span><span class="font-semibold">${car.dcChargeKw}</span></div>
              <div class="flex justify-between pt-1"><span class="text-slate-500">US / India Price:</span><span class="font-bold text-slate-900">${car.prices.us} / ${car.prices.in}</span></div>
            </div>
          </div>
          <div class="px-5 pb-5">
            <a href="/${car.slug}/" class="block w-full text-center bg-slate-900 hover:bg-emerald-600 text-white font-semibold py-2.5 rounded-xl text-sm transition">
              Full Specs & Calculator →
            </a>
          </div>
        </div>
      `).join('');
    }

    function quickSelectRival(slug) {
      const sel = document.getElementById('rivalSelect');
      if (sel) {
        sel.value = slug;
        updateRivalCompare();
        document.getElementById('inPageCompare').scrollIntoView({ behavior: 'smooth' });
      }
    }

    function updateRivalCompare() {
      const db = window.EV_DATABASE || [];
      const slug = document.getElementById('rivalSelect')?.value;
      const rival = db.find(c => c.slug === slug) || db[0];
      if (!currentCar || !rival) return;

      document.getElementById('rivalHeadName').innerHTML = `<a href="/${rival.slug}/" class="hover:underline">${rival.name} →</a>`;

      const rows = [
        ["Category & Powertrain", `${currentCar.category} (${getPowertrain(currentCar)})`, `${rival.category} (${getPowertrain(rival)})`],
        ["Battery Capacity (Usable)", `${currentCar.battery} (${currentCar.usableKwh} kWh)`, `${rival.battery} (${rival.usableKwh} kWh)`],
        ["Cell Chemistry", currentCar.chemistry, rival.chemistry],
        ["Official Range", currentCar.rangeText, rival.rangeText],
        ["Real-World Range", currentCar.realRange, rival.realRange],
        ["Charging Speed", `${currentCar.dcChargeKw} (${currentCar.dcChargeTime})`, `${rival.dcChargeKw} (${rival.dcChargeTime})`],
        ["Motor Power & Torque", `${currentCar.power} / ${currentCar.torque}`, `${rival.power} / ${rival.torque}`],
        ["Acceleration", currentCar.accel, rival.accel],
        ["Cargo / Capacity", currentCar.bootSpace, rival.bootSpace],
        ["🇺🇸 USA Price", currentCar.prices.us, rival.prices.us],
        ["🇬🇧 UK / 🇪🇺 EU Price", `${currentCar.prices.uk} / ${currentCar.prices.eu}`, `${rival.prices.uk} / ${rival.prices.eu}`],
        ["🇮🇳 India Price", currentCar.prices.in, rival.prices.in]
      ];

      document.getElementById('rivalCompareBody').innerHTML = rows.map(r => `
        <tr class="hover:bg-slate-50">
          <td class="p-3 text-slate-500 font-medium">${r[0]}</td>
          <td class="p-3 font-semibold text-slate-900 bg-emerald-50/30">${r[1]}</td>
          <td class="p-3 font-semibold text-slate-900">${r[2]}</td>
        </tr>
      `).join('');
    }

    function calcCharge() {
      const power = parseFloat(document.getElementById('chargerPower')?.value) || 11;
      const pct = parseFloat(document.getElementById('chargePercent')?.value) || 70;
      const rate = parseFloat(document.getElementById('elecRate')?.value) || 0.16;
      const kwhNeeded = currentBatteryKwh * (pct / 100);
      const hours = kwhNeeded / (power * 0.9);
      const cost = kwhNeeded * rate;
      const timeEl = document.getElementById('timeResult');
      const costEl = document.getElementById('costResult');
      if (timeEl) timeEl.innerText = hours < 1 ? Math.round(hours * 60) + ' Mins' : hours.toFixed(1) + ' Hours';
      if (costEl) costEl.innerText = '$' + cost.toFixed(2);
    }

    window.onload = initSmartRouter;
  </script>
</body>
</html>
