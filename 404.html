<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">EV Specifications, Range & Global Prices | EVCarSpec.com</title>
  <meta id="pageDesc" name="description" content="Complete technical specifications, battery capacity, real-world range, charging speed, and multi-country prices." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/evs-data.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <!-- Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="/" class="text-2xl font-extrabold tracking-tight text-emerald-400">EVCarSpec<span class="text-white">.com</span></a>
      <div class="flex items-center gap-3">
        <a href="/#compareSection" class="hidden sm:inline-block text-xs bg-emerald-600 hover:bg-emerald-500 px-3.5 py-2 rounded-lg font-bold transition">⚖️ Compare EVs</a>
        <a href="/" class="text-sm bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg font-medium transition">← All EVs</a>
      </div>
    </div>
  </header>

  <main id="mainContent" class="max-w-5xl mx-auto px-4 py-8">
    <!-- Automatically Populated by Smart Engine -->
  </main>

  <footer class="bg-slate-900 text-slate-400 py-8 px-4 text-center text-sm mt-12 border-t border-slate-800">
    <div class="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <p>© 2026 EVCarSpec.com — Independent Electric Vehicle Specifications Database.</p>
      <div class="space-x-4 text-xs">
        <a href="/about/" class="hover:text-white">About</a>
        <a href="/contact/" class="hover:text-white">Contact</a>
        <a href="/privacy-policy/" class="hover:text-white">Privacy Policy</a>
        <a href="/terms/" class="hover:text-white">Terms</a>
      </div>
    </div>
  </footer>

  <script>
    let currentBatteryKwh = 75;

    function loadDynamicCarPage() {
      // Read clean URL path e.g. /byd/seal/ -> "byd/seal"
      const path = window.location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
      const db = window.EV_DATABASE || [];
      const car = db.find(c => c.slug.toLowerCase() === path);

      const container = document.getElementById('mainContent');

      if (!car) {
        document.title = "Browse EV Specifications | EVCarSpec.com";
        container.innerHTML = `
          <div class="bg-white p-10 rounded-2xl shadow-sm border border-slate-200 text-center my-8">
            <h1 class="text-2xl font-extrabold text-slate-900 mb-3">Select an Electric Vehicle from Our Database</h1>
            <p class="text-slate-600 mb-6">Explore complete technical specifications, battery sizes, charging speeds, and global pricing below:</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 text-left max-w-4xl mx-auto">
              ${db.map(item => `
                <a href="/${item.slug}/" class="p-4 rounded-xl border border-slate-200 hover:border-emerald-500 bg-slate-50 hover:bg-emerald-50 transition block">
                  <span class="text-xs font-bold text-emerald-600 uppercase">${item.brand} • ${item.category}</span>
                  <strong class="block text-slate-900 font-bold">${item.name}</strong>
                  <span class="text-xs text-slate-500">${item.battery} • ${item.rangeText}</span>
                </a>
              `).join('')}
            </div>
          </div>
        `;
        return;
      }

      currentBatteryKwh = car.usableKwh || 60;
      document.title = `${car.name} Specifications, Battery, Range, Charging & Global Price | EVCarSpec`;

      const relatedCars = db.filter(c => c.slug !== car.slug).slice(0, 6);

      container.innerHTML = `
        <!-- Breadcrumbs -->
        <nav class="text-xs text-slate-500 mb-4">
          <a href="/" class="hover:underline">Home</a> &raquo; <span>${car.brand}</span> &raquo; <span class="text-slate-800 font-semibold">${car.name}</span>
        </nav>

        <!-- Hero Overview & Verdict -->
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 mb-8">
          <div class="flex flex-wrap items-center gap-2 mb-3">
            <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full uppercase">${car.brand}</span>
            <span class="bg-slate-100 text-slate-700 text-xs font-bold px-3 py-1 rounded-full uppercase">${car.category}</span>
            <span class="bg-blue-50 text-blue-700 text-xs font-bold px-3 py-1 rounded-full">${car.architecture} Architecture</span>
          </div>
          <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-4">${car.name} — Full Specifications, Range & Global Price</h1>
          <p class="text-slate-600 leading-relaxed mb-6">${car.verdict}</p>

          <!-- Key Highlights Strip -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100 text-center">
            <div><span class="block text-xs text-slate-500">Battery Capacity</span><strong class="text-lg text-slate-900">${car.battery}</strong></div>
            <div><span class="block text-xs text-slate-500">Official Range</span><strong class="text-lg text-emerald-600">${car.rangeText}</strong></div>
            <div><span class="block text-xs text-slate-500">DC Fast Charging</span><strong class="text-lg text-slate-900">${car.dcChargeKw}</strong></div>
            <div><span class="block text-xs text-slate-500">Acceleration</span><strong class="text-lg text-slate-900">${car.accel}</strong></div>
          </div>

          <!-- Pros & Cons Box (AdSense High-Value Editorial) -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
            <div class="bg-emerald-50/60 border border-emerald-200 p-4 rounded-xl">
              <h3 class="text-sm font-bold text-emerald-900 mb-2">✅ Key Strengths (Pros)</h3>
              <ul class="text-xs text-emerald-800 space-y-1.5 list-disc pl-4">
                ${(car.pros || []).map(p => `<li>${p}</li>`).join('')}
              </ul>
            </div>
            <div class="bg-rose-50/60 border border-rose-200 p-4 rounded-xl">
              <h3 class="text-sm font-bold text-rose-900 mb-2">⚠️ Limitations (Cons)</h3>
              <ul class="text-xs text-rose-800 space-y-1.5 list-disc pl-4">
                ${(car.cons || []).map(c => `<li>${c}</li>`).join('')}
              </ul>
            </div>
          </div>
        </div>

        <!-- Global Prices Table -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
          <h2 class="text-xl font-bold text-slate-900 mb-4">🌍 ${car.name} Country-Wise Price Guide</h2>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 text-center text-sm">
            <div class="p-3 bg-slate-50 rounded-xl border"><span class="block text-xs text-slate-500">🇺🇸 USA</span><strong class="text-slate-900">${car.prices.us}</strong></div>
            <div class="p-3 bg-slate-50 rounded-xl border"><span class="block text-xs text-slate-500">🇬🇧 UK</span><strong class="text-slate-900">${car.prices.uk}</strong></div>
            <div class="p-3 bg-slate-50 rounded-xl border"><span class="block text-xs text-slate-500">🇪🇺 Europe</span><strong class="text-slate-900">${car.prices.eu}</strong></div>
            <div class="p-3 bg-slate-50 rounded-xl border"><span class="block text-xs text-slate-500">🇨🇳 China</span><strong class="text-slate-900">${car.prices.cn}</strong></div>
            <div class="p-3 bg-slate-50 rounded-xl border"><span class="block text-xs text-slate-500">🇦🇪 UAE</span><strong class="text-slate-900">${car.prices.ae}</strong></div>
            <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-200"><span class="block text-xs text-emerald-700">🇮🇳 India</span><strong class="text-emerald-900">${car.prices.in}</strong></div>
          </div>
        </div>

        <!-- 4-Block Technical Specifications Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-900 mb-4 border-b pb-2">🔋 Battery & Real-World Range</h2>
            <div class="space-y-3 text-sm">
              <div class="flex justify-between"><span class="text-slate-500">Battery Capacity:</span><span class="font-semibold">${car.battery}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Usable Capacity:</span><span class="font-semibold">${car.usableKwh} kWh</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Cell Chemistry:</span><span class="font-semibold">${car.chemistry}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Certified Range:</span><span class="font-semibold text-emerald-600">${car.rangeText}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Real-World Range:</span><span class="font-semibold">${car.realRange}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Energy Efficiency:</span><span class="font-semibold">${car.efficiency}</span></div>
            </div>
          </div>

          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-900 mb-4 border-b pb-2">⚡ Charging Speed & Time</h2>
            <div class="space-y-3 text-sm">
              <div class="flex justify-between"><span class="text-slate-500">Architecture:</span><span class="font-semibold">${car.architecture}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Peak DC Fast Charge:</span><span class="font-semibold">${car.dcChargeKw}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">DC Fast Charge Time:</span><span class="font-semibold">${car.dcChargeTime}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">AC Onboard Charger:</span><span class="font-semibold">${car.acChargeKw}</span></div>
            </div>
          </div>

          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-900 mb-4 border-b pb-2">🚀 Motor Power & Acceleration</h2>
            <div class="space-y-3 text-sm">
              <div class="flex justify-between"><span class="text-slate-500">Drivetrain:</span><span class="font-semibold">${car.drive}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Horsepower:</span><span class="font-semibold">${car.power}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Peak Torque:</span><span class="font-semibold">${car.torque}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Acceleration:</span><span class="font-semibold">${car.accel}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Top Speed:</span><span class="font-semibold">${car.topSpeed}</span></div>
            </div>
          </div>

          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-900 mb-4 border-b pb-2">📏 Dimensions, Boot & Weight</h2>
            <div class="space-y-3 text-sm">
              <div class="flex justify-between"><span class="text-slate-500">Dimensions (L×W×H):</span><span class="font-semibold">${car.dimensions}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Wheelbase:</span><span class="font-semibold">${car.wheelbase}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Cargo / Boot Space:</span><span class="font-semibold">${car.bootSpace}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Curb Weight:</span><span class="font-semibold">${car.weight}</span></div>
            </div>
          </div>
        </div>

        <!-- Interactive Charging Calculator -->
        <div class="bg-slate-900 text-white p-6 md:p-8 rounded-2xl shadow-md mb-8">
          <h2 class="text-xl font-bold text-emerald-400 mb-2">🧮 Interactive ${car.name} Charging Calculator</h2>
          <p class="text-slate-300 text-sm mb-6">Estimate charging time and electricity cost based on the ${car.usableKwh} kWh usable battery pack.</p>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 text-slate-900">
            <div>
              <label class="block text-xs text-slate-300 mb-1">Charger Power (kW)</label>
              <select id="chargerPower" onchange="calcCharge()" class="w-full p-3 rounded-lg font-semibold">
                <option value="3.3">3.3 kW (Standard Home Socket)</option>
                <option value="7.4">7.4 kW (1-Phase Home Wallbox)</option>
                <option value="11" selected>11 kW (3-Phase AC Wallbox)</option>
                <option value="60">60 kW (Public DC Charger)</option>
                <option value="150">150 kW (High-Power DC Fast Charger)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-slate-300 mb-1">Charge Needed (%)</label>
              <input id="chargePercent" type="number" value="70" min="10" max="100" oninput="calcCharge()" class="w-full p-3 rounded-lg font-semibold" />
            </div>
            <div>
              <label class="block text-xs text-slate-300 mb-1">Electricity Rate ($ per kWh)</label>
              <input id="elecRate" type="number" value="0.16" step="0.01" oninput="calcCharge()" class="w-full p-3 rounded-lg font-semibold" />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4 bg-slate-800 p-4 rounded-xl text-center">
            <div><span class="text-xs text-slate-400 block">Estimated Time</span><strong id="timeResult" class="text-2xl text-emerald-400">--</strong></div>
            <div><span class="text-xs text-slate-400 block">Estimated Cost</span><strong id="costResult" class="text-2xl text-emerald-400">--</strong></div>
          </div>
        </div>

        <!-- Internal Links to Other EVs (Boosts Google SEO Crawling) -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold text-slate-900 mb-4">Compare with Other Popular Electric Vehicles</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
            ${relatedCars.map(r => `
              <a href="/${r.slug}/" class="p-3.5 rounded-xl border border-slate-200 hover:border-emerald-500 transition block">
                <span class="text-xs font-bold text-emerald-600 uppercase">${r.brand}</span>
                <strong class="block text-sm text-slate-900">${r.name}</strong>
                <span class="text-xs text-slate-500">${r.rangeText} • ${r.prices.us}</span>
              </a>
            `).join('')}
          </div>
        </div>
      `;
      calcCharge();
    }

    function calcCharge() {
      const power = parseFloat(document.getElementById('chargerPower')?.value) || 11;
      const pct = parseFloat(document.getElementById('chargePercent')?.value) || 70;
      const rate = parseFloat(document.getElementById('elecRate')?.value) || 0.16;
      const kwhNeeded = currentBatteryKwh * (pct / 100);
      const hours = kwhNeeded / (power * 0.9);
      const cost = kwhNeeded * rate;
      const timeEl = document.getElementById('timeResult');
      const costEl = document.getElementById('costResult');
      if (timeEl) timeEl.innerText = hours < 1 ? Math.round(hours * 60) + ' Mins' : hours.toFixed(1) + ' Hours';
      if (costEl) costEl.innerText = '$' + cost.toFixed(2);
    }

    window.onload = loadDynamicCarPage;
  </script>
</body>
</html>
